<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>開啟新商品通知</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 40px 20px; background: #f8f9fa; color: #333; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; margin: 0 auto; }
    h2 { margin-top: 0; color: #0d6efd; }
    p { color: #6c757d; font-size: 14px; line-height: 1.5; }
    button { background: #0d6efd; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.2s; }
    button:hover { background: #0b5ed7; }
    .status { margin-top: 15px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔔 訂閱商品更新通知</h2>
    <p>點擊下方按鈕並在瀏覽器跳出提示時選擇「允許」，即可第一時間接收新品通知！</p>
    <button onclick="requestPushPermission()">立即開啟通知</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    // 取得網址參數中的買家 ID
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user') || '訪客';

    async function requestPushPermission() {
      const statusDiv = document.getElementById('status');
      
      if (!("Notification" in window)) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "⚠️ 您的瀏覽器不支援推播通知";
        return;
      }

      try {
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          statusDiv.style.color = "#198754";
          statusDiv.innerText = "⏳ 正在向 OneSignal 註冊...";

          // 呼叫 OneSignal REST API 註冊裝置
          const res = await fetch("https://onesignal.com/api/v1/players", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({
              app_id: "8b1953c2-1870-45ca-9e23-26110147c8c3",
              device_type: 5, // Chrome/Web Push
              identifier: "",
              language: "zh-Hant"
            })
          });

          const data = await res.json();
          const onesignalId = data.id || "granted";

          // 通知原 GAS 視窗回覆狀態（若母視窗還開著）
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              type: 'PUSH_SUBSCRIBED',
              userId: userId,
              onesignalId: onesignalId
            }, '*');
          }

          statusDiv.innerText = "✅ 已成功開啟通知！可以關閉此視窗了。";
          setTimeout(() => window.close(), 2500);
        } else {
          statusDiv.style.color = "red";
          statusDiv.innerText = "⚠️ 權限已被拒絕，請點擊網址列鎖頭允許通知。";
        }
      } catch (err) {
        console.error(err);
        statusDiv.style.color = "red";
        statusDiv.innerText = "⚠️ 發生錯誤，請重試。";
      }
    }
  </script>
</body>
</html>
